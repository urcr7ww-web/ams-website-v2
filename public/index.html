<!DOCTYPE html><html lang="en"><head><meta http-equiv="Content-Type" content="text/html; charset=UTF-8"><style>
@charset "utf-8";

:root { --site-primary: #2864f0; --site-on-primary: #ffffff; --site-secondary: #101827; --site-on-secondary: #ffffff; --site-background: light-dark(#f6f8fc,#101827); --site-on-background: light-dark(#101827,#f6f8fc); --site-font-body: Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif; --site-font-heading: Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif; --site-heading-scale: 1; --site-spacing-scale: 1; --site-radius-scale: 1; --site-decoration-opacity: 1; --ink: #101827; --muted: #667085; --blue: var(--site-primary); --cyan: #5eead4; --paper: #f6f8fc; --line: #e7ebf2; --white: #fff; }

* { box-sizing: border-box; }

html { scroll-behavior: smooth; }

body { margin: 0px; font-family: var(--site-font-body); color: var(--site-on-background); background-color: var(--site-background); }

a { text-decoration: none; color: inherit; }

.wrap { width: min(1160px, 92%); margin: auto; }

header { background: rgb(255, 255, 255); border-bottom: 1px solid var(--line); position: sticky; top: 0px; z-index: 10; }

.nav { height: 72px; display: flex; align-items: center; justify-content: space-between; gap: 20px; }

.brand { font-size: 17px; font-weight: 850; letter-spacing: -0.55px; line-height: 1.15; }

.brand span { color: var(--blue); }

.menu-toggle { display:none; border:1px solid var(--line); background:#fff; color:var(--ink); border-radius:10px; padding:9px 12px; font-weight:750; }
.navlinks { display: flex; gap: 26px; color: rgb(71, 84, 103); font-size: 14px; font-weight: 650; }

.navlinks a:hover { color: var(--blue); }

.navcta, .btn { background: var(--blue); color: rgb(255, 255, 255); padding: 12px 18px; border-radius: 12px; font-weight: 750; font-size: 14px; display: inline-block; border: 0px; cursor: pointer; }

.hero { background: radial-gradient(circle at 80% 20%, rgb(35, 78, 145) 0px, rgb(23, 42, 75) 30%, rgb(16, 24, 39) 68%); color: white; padding: 76px 0px 66px; overflow: hidden; }

.hero-grid { display: grid; grid-template-columns: 1.12fr 0.88fr; align-items: center; gap: 44px; }

.eyebrow { color: var(--cyan); font-size: 12px; font-weight: 850; letter-spacing: 1.8px; text-transform: uppercase; }

.hero h1 { font-size: clamp(38px, 5.4vw, 64px); line-height: 1.04; letter-spacing: -2.6px; margin: 16px 0px; }

.hero p { color: rgb(212, 219, 234); line-height: 1.7; max-width: 570px; font-size: 16px; }

.hero-actions { display: flex; gap: 12px; flex-wrap: wrap; margin-top: 26px; }

.btn.light { background: rgb(255, 255, 255); color: var(--ink); }

.hero-note { margin-top: 18px; font-size: 12px !important; color: rgb(174, 187, 208) !important; }

.device-stage { min-height: 300px; display: grid; place-items: center; position: relative; }

.glow { position: absolute; width: 280px; height: 280px; background: rgb(40, 100, 240); filter: blur(90px); opacity: 0.45; border-radius: 50%; }

.phone { position: relative; width: 190px; height: 330px; border: 8px solid rgb(41, 54, 75); border-radius: 34px; background: linear-gradient(145deg, rgb(217, 243, 255), rgb(138, 169, 255) 50%, rgb(53, 75, 155)); box-shadow: rgba(0, 0, 0, 0.533) 0px 35px 80px; transform: rotate(9deg); }

.phone::before { content: ""; position: absolute; top: 8px; left: 50%; transform: translateX(-50%); width: 62px; height: 15px; background: rgb(24, 35, 55); border-radius: 12px; }

.phone::after { content: ""; position: absolute; inset: 70px 18px 22px; border-radius: 22px; background: linear-gradient(140deg, rgba(255, 255, 255, 0.6), rgba(255, 255, 255, 0.03)); border: 1px solid rgba(255, 255, 255, 0.44); }

.float-card { position: absolute; background: rgb(255, 255, 255); color: var(--ink); padding: 14px 17px; border-radius: 15px; box-shadow: rgba(0, 0, 0, 0.267) 0px 14px 35px; font-size: 13px; font-weight: 750; }

.float-card small { display: block; color: var(--muted); font-weight: 550; margin-top: 4px; }

.fc1 { left: 0px; top: 52px; }

.fc2 { right: 0px; bottom: 42px; }

.trust { background: rgb(255, 255, 255); border-bottom: 1px solid var(--line); }

.trustrow { display: grid; grid-template-columns: repeat(3, 1fr); gap: 18px; padding: 20px 0px; }

.trustitem { font-size: 13px; color: rgb(71, 84, 103); font-weight: 650; display: flex; align-items: center; gap: 10px; }

.check { width: 28px; height: 28px; border-radius: 9px; background: rgb(233, 249, 245); color: rgb(8, 127, 103); display: grid; place-items: center; font-weight: 900; }

section { padding: 70px 0px; }

.section-head { text-align: center; max-width: 680px; margin: 0px auto 32px; }

.kicker { color: var(--blue); font-size: 12px; font-weight: 850; letter-spacing: 1.5px; text-transform: uppercase; }

.section-head h2 { font-size: clamp(28px, 4vw, 40px); letter-spacing: -1.4px; margin: 10px 0px; }

.section-head p { color: var(--muted); line-height: 1.65; margin: 0px; }

.repairs { background: rgb(255, 255, 255); }

.repair-tools { display: flex; justify-content: center; gap: 10px; flex-wrap: wrap; margin: 25px 0px; }

.filter { border: 1px solid var(--line); background: rgb(255, 255, 255); border-radius: 999px; padding: 10px 16px; font-weight: 700; color: rgb(71, 84, 103); cursor: pointer; }

.filter.active { background: var(--ink); border-color: var(--ink); color: white; }

.repair-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; }

.repair-card { border: 1px solid var(--line); border-radius: 17px; padding: 20px; background: rgb(255, 255, 255); transition: 0.2s; }

.repair-card:hover { transform: translateY(-3px); box-shadow: rgba(23, 42, 75, 0.07) 0px 14px 32px; }

.repair-icon { width: 43px; height: 43px; background: rgb(237, 243, 255); color: var(--blue); border-radius: 13px; display: grid; place-items: center; font-size: 21px; }

.repair-card h3 { font-size: 16px; margin: 15px 0px 6px; }

.repair-card p { font-size: 12px; color: var(--muted); line-height: 1.5; min-height: 36px; margin: 0px; }

.price { font-size: 23px; font-weight: 850; letter-spacing: -0.8px; margin-top: 16px; }

.price small { font-size: 11px; color: var(--muted); font-weight: 600; letter-spacing: 0px; }

.repair-foot { font-size: 12px; color: var(--muted); text-align: center; margin-top: 22px; }

.estimate { background: rgb(240, 244, 251); }

.estimate-box { max-width: 760px; margin: auto; background: rgb(255, 255, 255); border: 1px solid var(--line); border-radius: 22px; padding: 28px; box-shadow: rgba(23, 42, 75, 0.04) 0px 16px 40px; }

.formgrid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }

.field label { display: block; font-size: 12px; font-weight: 800; margin-bottom: 8px; color: rgb(71, 84, 103); }

.field select { width: 100%; padding: 13px; border: 1px solid rgb(217, 224, 235); border-radius: 11px; background: rgb(255, 255, 255); font: inherit; color: var(--ink); }

.estimate-result { background: rgb(16, 24, 39); color: rgb(255, 255, 255); padding: 20px; border-radius: 15px; margin-top: 18px; display: flex; justify-content: space-between; align-items: center; gap: 16px; }

.estimate-result small { color: rgb(184, 196, 215); display: block; }

.estimate-result strong { font-size: 27px; }

.estimate-result p { font-size: 11px; color: rgb(184, 196, 215); margin: 5px 0px 0px; }

.products { background: var(--paper); }

.product-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; }

.product { background: rgb(255, 255, 255); border: 1px solid var(--line); border-radius: 18px; padding: 22px; }

.product-art { height: 140px; border-radius: 13px; background: linear-gradient(135deg, rgb(233, 241, 255), rgb(245, 248, 255)); display: grid; place-items: center; font-size: 52px; }

.product h3 { margin: 17px 0px 5px; }

.product p { color: var(--muted); font-size: 13px; margin: 0px; }

.product .tag { display: inline-block; margin-top: 14px; padding: 6px 9px; background: rgb(238, 244, 255); color: rgb(36, 85, 199); border-radius: 8px; font-size: 11px; font-weight: 800; }

.how { background: rgb(255, 255, 255); }

.steps { display: grid; grid-template-columns: repeat(3, 1fr); gap: 18px; }

.step { padding: 23px; border: 1px solid var(--line); border-radius: 17px; }

.num { font-size: 12px; font-weight: 900; color: var(--blue); }

.step h3 { margin: 12px 0px 7px; }

.step p { color: var(--muted); font-size: 13px; line-height: 1.6; margin: 0px; }

.contact { background: rgb(16, 24, 39); color: rgb(255, 255, 255); }

.contact-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 35px; align-items: center; }

.contact h2 { font-size: 38px; letter-spacing: -1.4px; margin: 10px 0px; }

.contact p { color: rgb(189, 200, 217); line-height: 1.7; }

.contact-card { background: rgb(28, 42, 64); border: 1px solid rgb(52, 67, 91); border-radius: 18px; padding: 24px; }

.contact-card label { display: block; font-size: 12px; color: rgb(198, 209, 225); margin: 12px 0px 6px; }

.contact-card input, .contact-card textarea { width: 100%; padding: 12px; border: 1px solid rgb(64, 81, 107); background: rgb(16, 24, 39); color: rgb(255, 255, 255); border-radius: 10px; font: inherit; }

.contact-card textarea { min-height: 80px; resize: vertical; }

.contact-card button { margin-top: 14px; width: 100%; }

footer { padding: 24px 0px; background: rgb(11, 18, 32); color: rgb(158, 172, 193); font-size: 12px; }

.footerrow { display: flex; justify-content: space-between; gap: 15px; flex-wrap: wrap; }

@media (max-width: 850px) {
  .hero-grid { grid-template-columns: 1fr; }
  .device-stage { min-height: 270px; }
  .repair-grid { grid-template-columns: repeat(2, 1fr); }
  .product-grid { grid-template-columns: 1fr 1fr; }
}

@media (max-width: 600px) {
  .nav { height: 62px; }
  .menu-toggle { display:block; }
  .navlinks { display:none; position:absolute; top:62px; left:4%; right:4%; background:#fff; border:1px solid var(--line); border-radius:14px; padding:16px; box-shadow:0 14px 35px rgba(16,24,39,.14); flex-direction:column; gap:16px; }
  .navlinks.open { display:flex; }
  .navcta { padding: 10px 12px; }
  .hero { padding: 56px 0px 42px; }
  .hero h1 { letter-spacing: -1.6px; }
  .trustrow { grid-template-columns: 1fr; gap: 10px; }
  .repair-grid { grid-template-columns: 1fr 1fr; gap: 9px; }
  .repair-card { padding: 14px; }
  .repair-card p { min-height: 52px; }
  .price { font-size: 20px; }
  .formgrid, .contact-grid, .steps, .product-grid { grid-template-columns: 1fr; }
  .estimate-box { padding: 18px; }
  .estimate-result { align-items: flex-start; flex-direction: column; }
  section { padding: 54px 0px; }
  .fc1 { left: -5px; }
  .fc2 { right: -5px; }
}
</style>
